<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivero Institucional</title>
    <link rel="stylesheet" href="../css/encabezado.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/agendarCita.css">
    <link rel="stylesheet" href="../css/editarCita.css">

    <style>
        @media print {

            body,
            html {
                background-color: white;
            }
        }
    </style>
</head>

<body>
    <header id="encabezado">
        <div class="encabezado-container">
            <div class="logo-container">
                MedicCorp
            </div>

            <nav>
                <ul class="nav">
                    <li><a href="agendarCita.html">Agendar cita</a></li>
                    <li><a href="verCitas.html">Ver citas</a></li>
                    <li><a href="calendario.html">Calendario</a></li>
                    <li><a href="verPacientes.html">Ver pacientes</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="espaciado">
    </div>

    <main>
        <section id="contenedor-cita">
            <br><br><br>
            <div id="citaForm">
                <form name="forma" action="" onsubmit="alert('editando datos...')" method="post" enctype="">
                    <h2>Editar cita</h2>
                    <!-- Campos del formulario -->
                    <table align="center">
                        <tr>
                            <td><label for="diaCita">¿Qué día?:</label></td>
                            <td>
                                <select name="diaCita" id="diaCita" required>
                                    <option value='lunes' selected>Lunes</option>
                                    <option value='martes'>Martes</option>
                                    <option value='miercoles'>Miércoles</option>
                                    <option value='jueves'>Jueves</option>
                                    <option value='viernes'>Viernes</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="horaCita">¿A qué hora?:</label></td>
                            <td>
                                <select name="diaCita" id="diaCita" required size="1">
                                    <option value='09:00' selected>09:00</option>
                                    <option value='09:30' >09:30</option>
                                    <option value='10:00' >10:00</option>
                                    <option value='10:30' >10:30</option>
                                    <option value='11:00' >11:00</option>
                                    <option value='11:30' >11:30</option>
                                    <option value='12:00' >12:00</option>
                                    <option value='12:30' >12:30</option>
                                    <option value='13:00' >13:00</option>
                                    <option value='13:30' >13:30</option>
                                    <option value='14:00' >14:00</option>
                                    <option value='14:30' >14:30</option>
                                    <option value='15:00' >15:00</option>
                                    <option value='15:30' >15:30</option>
                                    <option value='16:00' >16:00</option>
                                    <option value='16:30' >16:30</option>
                                    <option value='17:00' >17:00</option>
                                </select>
                            </td>
                        </tr>
                    </table>

                    <br>

                    <div class="contenedor-botones">
                        <a href="verCitas.html">Cancelar</a>
                        <button type="submit">Editar</button>
                    </div>

                </form>
            </div>
        </section>
    </main>

    <button onclick="regresarArriba()" id="botonSubir" title="Subir">
        <p><i class="arrow up"></i></p>
    </button>
</body>
<script src="../js/index.js"></script>

</html>
