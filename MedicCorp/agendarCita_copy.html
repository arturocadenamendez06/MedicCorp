<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivero Institucional</title>
    <link rel="stylesheet" href="css/encabezado.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/agendarCita.css">
    
    <style>
        @media print{
            body,html{
                background-color: white;
            }
            #contenedor-Objetivo{
                padding-top: 150px;
                box-shadow: 0 4px 15px white;
            }

            #acciones-Logros{
                padding-top: 200px;
                padding-bottom: 150px;
                box-shadow: 0 4px 15px white;
            }
        }
    </style>
</head>
<body>
    <header id="encabezado">
        <div class="encabezado-container">
            <div class="logo-container">
                MedicCorp
            </div>
            
            <nav>
                <ul class="nav">
                    <li><a href="">Agendar cita</a></li>
                    <li><a href="">Ver citas</a></li>
                    <li><a href="">Historial</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="espaciado">
    </div>

    <main>
        <section id="contenedor-cita">
            <br><br><br>
            <div id="citaForm">
                <form name="forma" action="" method="post" enctype="">
                    <h2>¡Agende su cita ahora!</h2>
                    <!-- Otros campos del formulario -->
                    <table align="center">
                        <tr>
                            <td><label for="diaCita">¿Qué día?:</label></td>
                            <td><input type="text" id="diaCita" name="diaCita" placeholder="Día de la cita" value=""></td>
                        </tr>
                        <tr>
                            <td><label for="horaCita">¿A qué hora?:</label></td>
                            <td><input type="text" id="horaCita" name="horaCita" placeholder="Hora de la cita" value="">
                            </td>
                        </tr>
                        <tr>
                            <td><label for="familia">Familia de la planta:</label></td>
                            <td>
                                <select name="familia" id="familia">
                                    <option value='' selected>hola</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="fruto">Fruto de la planta:</label></td>
                            <td><input type="text" id="fruto" name="fruto" placeholder="Fruto" value="">
                            </td>
                        </tr>
                        <tr>
                            <td><label for="floracion">Floracion de la planta:</label></td>
                            <td><input type="text" id="floracion" name="floracion" placeholder="Floracion" value=""></td>
                        </tr>
                    </table>

                    <br>
                    <label for="descripcion">Descripcion de la planta</label>
                    <textarea id="descripcion" name="descripcion" placeholder="Descripción de la planta" rows="5"></textarea>

                    <label for="usos">Usos de la planta</label>
                    <textarea name="usos" id="usos" rows="5"></textarea>

                    

                    <button type="submit">Enviar</button>

                </form>
            </div>
        </section>
    </main>

    <button onclick="regresarArriba()" id="botonSubir" title="Subir"><p><i class="arrow up"></i></p></button>
</body>
<script src="js/index.js"></script>
</html>
