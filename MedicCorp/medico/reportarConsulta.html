<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedicCorp - Reporte de Consulta</title>
    <link rel="stylesheet" href="../css/encabezado.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/agendarCita.css">
    <link rel="stylesheet" href="../css/reportarConsulta.css">
    <link rel="stylesheet" href="../css/editarCita.css">

    <style>
        @media print {

            body,
            html {
                background-color: white;
            }

            #contenedor-Objetivo {
                padding-top: 150px;
                box-shadow: 0 4px 15px white;
            }

            #acciones-Logros {
                padding-top: 200px;
                padding-bottom: 150px;
                box-shadow: 0 4px 15px white;
            }
        }
        
        .mensaje-exito {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .mensaje-error {
            background-color: #f44336;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .campo-requerido {
            color: red;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <header id="encabezado">
        <div class="encabezado-container">
            <div class="logo-container">
                MedicCorp
            </div>

            <nav>
                <ul class="nav">
                    <li><a href="agendarCita.html">Agendar cita</a></li>
                    <li><a href="verCitas.html">Ver citas</a></li>
                    <li><a href="calendario.html">Calendario</a></li>
                    <li><a href="verPacientes.html">Ver pacientes</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="espaciado">
    </div>

    <main>

        <div class="contenedor-consulta">
            <div class="encabezado-consulta">
                <div>
                    <h2>Reporte de Consulta</h2>
                </div>
                <div class="fecha-cita" id="infoCita">
                    <p>Cargando información de la cita...</p>
                </div>
            </div>
            
            <div id="mensajeContainer"></div>
            
            <!-- formulario para editar los datos de una consulta -->
            <form id="formReporteConsulta">
                <input type="hidden" id="id_cita" name="id_cita">
                
                <table class="tabla-consulta">
                    <tr>
                        <th style="width: 20%;">Temperatura corporal:</th>
                        <td style="width: 20%;"><input type="text" id="temperatura" name="temperatura" placeholder="Ej: 36.5°C"></td>
                        <td style="width: 5%;"></td>
                        <th style="width: 20%;">Diagnóstico:</th>
                        <td><textarea id="diagnostico" name="diagnostico" placeholder="Ingrese el diagnóstico" rows="5"></textarea></td>
                    </tr>
                    <tr>
                        <th>Peso (kg):</th>
                        <td><input type="text" id="peso" name="peso" placeholder="Ej: 70.5"></td>
                        <td></td>
                        <th>Resultado de análisis:</th>
                        <td><textarea id="resultado_analisis" name="resultado_analisis" placeholder="Ingrese los resultados de análisis" rows="5"></textarea></td>
                    </tr>
                    <tr>
                        <th>Altura (m):</th>
                        <td><input type="text" id="altura" name="altura" placeholder="Ej: 1.75"></td>
                        <td></td>
                        <th>Prescripciones:</th>
                        <td><textarea id="prescripcion" name="prescripcion" placeholder="Ingrese las prescripciones médicas" rows="5"></textarea></td>
                    </tr>
                    <tr>
                        <th>Presión arterial:</th>
                        <td><input type="text" id="presion_art" name="presion_art" placeholder="Ej: 120/80"></td>
                    </tr>
                </table>

                <br>

                <div class="contenedor-botones">
                    <a href="verCitas.html" id="btnCancelar">Cancelar</a>
                    <button type="submit">Guardar reporte</button>
                </div>

            </form>
        </div>

    </main>

    <button onclick="regresarArriba()" id="botonSubir" title="Subir">
        <p><i class="arrow up"></i></p>
    </button>
    
    <script>
        function regresarArriba() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
    <script src="../js/reportarConsulta.js"></script>

</body>

</html>
